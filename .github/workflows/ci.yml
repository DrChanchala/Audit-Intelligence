name: SiteIQ Verification & Security CI

on:
  push:
    branches: [ main, develop, refactor/modular-architecture ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify-and-test:
    name: Ruff, Pytest (SQLite & Postgres) & Container Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siteiq
          POSTGRES_PASSWORD: siteiq_password
          POSTGRES_DB: siteiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff Lint & Syntax Check
        run: |
          ruff check app tests

      - name: Pytest Suite on SQLite
        env:
          APP_ENV: development
          SITEIQ_JWT_SECRET: test-super-secret-jwt-key-for-siteiq-testing-32chars!
        run: |
          pytest -q

      - name: Pytest Suite on PostgreSQL
        env:
          APP_ENV: development
          DATABASE_URL: postgresql://siteiq:siteiq_password@localhost:5432/siteiq_test
          SITEIQ_JWT_SECRET: test-super-secret-jwt-key-for-siteiq-testing-32chars!
        run: |
          pytest -q

      - name: Build Docker Container
        run: |
          docker build -t siteiq-platform:test .
