version: '3.8'

services:
  audit-intelligence:
    build: .
    container_name: audit_intelligence_app
    restart: always
    ports:
      - "80:8000"
    volumes:
      - audit_data:/app/data
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  audit_data:
