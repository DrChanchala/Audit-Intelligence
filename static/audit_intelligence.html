<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Audit Intelligence - QC Lead Dashboard</title>
<meta name="theme-color" content="#0F2236">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans:wght@400;500;600;700&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/js/allocation_module.js"></script>
<style>
/* AI Report Markdown Styling */
.report-content { font-size:14px; line-height:1.65; color:var(--ink); }
.report-content h1 { font-family:var(--font-display); font-size:22px; margin-top:16px; margin-bottom:8px; border-bottom:2px solid var(--line); padding-bottom:6px; color:var(--band-1); }
.report-content h2 { font-family:var(--font-display); font-size:18px; margin-top:20px; margin-bottom:8px; color:var(--band-2); border-left:4px solid var(--mint); padding-left:8px; }
.report-content h3 { font-size:15px; font-weight:700; margin-top:14px; margin-bottom:6px; }
.report-content p { margin-bottom:10px; }
.report-content ul, .report-content ol { margin:0 0 12px 20px; padding:0; }
.report-content li { margin-bottom:4px; }
.report-content table { width:100%; border-collapse:collapse; margin:14px 0; font-size:12.5px; border-radius:8px; overflow:hidden; }
.report-content th, .report-content td { border:1px solid var(--line); padding:7px 10px; text-align:left; }
.report-content th { background:var(--surface-2); font-weight:700; color:var(--ink); }
.report-content hr { border:0; border-top:1px solid var(--line); margin:18px 0; }
.report-content code { background:var(--surface-2); padding:2px 5px; border-radius:4px; font-size:12px; font-family:monospace; }
.ai-badge { display:inline-flex; align-items:center; gap:6px; background:linear-gradient(135deg, #0F2236, #163E39); color:#5CCB9F; font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; letter-spacing:0.04em; }
/* Layout: mobile-first single column — dark navy-teal top bar, project cards, bottom nav; desktop adds a dark sidebar and a card grid. Detail lives in bottom sheets (mobile) / side panel (desktop). */
:root{
  --bg:#EDF3F0; --surface:#FFFFFF; --surface-2:#F3F7F5; --ink:#10201E; --ink-2:#4D5E5A; --ink-3:#6F807B; --line:#DAE5E0;
  --band-1:#0F2236; --band-2:#163E39; --band-ink:#F2F7F5; --band-ink-2:#B9CCC6; --band-line:rgba(255,255,255,.15);
  --mint:#4FB892; --mint-ink:#257A5B; --mint-soft:#E0F2EA; --on-mint:#0B2A21;
  --crit:#C93C24; --crit-soft:#FBE5E0; --major:#A0650B; --major-soft:#FBEFD9; --minor:#2F62CC; --minor-soft:#E3EBFB; --ofi:#4F7468; --ofi-soft:#E4EEEA;
  --st-live:var(--mint); --st-hold:var(--major); --st-upcoming:var(--minor); --st-completed:var(--ofi);
  --scrim:rgba(6,16,14,.48); --shadow:0 1px 2px rgba(16,32,30,.05),0 8px 24px rgba(16,32,30,.06);
  --photo-1:#7C8683; --photo-2:#AAB1AD; --photo-3:#6A7370; --stamp-bg:rgba(0,0,0,.58); --stamp-ink:#FFFFFF;
  --font-display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --font-body:"Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --side:248px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1412; --surface:#11201D; --surface-2:#172925; --ink:#E5EEEB; --ink-2:#A6B8B3; --ink-3:#869994; --line:#25413C;
  --band-1:#0A1828; --band-2:#12332F; --band-ink:#F2F7F5; --band-ink-2:#B9CCC6; --band-line:rgba(255,255,255,.13);
  --mint:#5CCB9F; --mint-ink:#72D8AE; --mint-soft:#15382E; --on-mint:#0B2A21;
  --crit:#F27058; --crit-soft:#3B1C16; --major:#E6A84A; --major-soft:#392A13; --minor:#7A9DF0; --minor-soft:#1A2744; --ofi:#94B7AB; --ofi-soft:#1B302A;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0A1412; --surface:#11201D; --surface-2:#172925; --ink:#E5EEEB; --ink-2:#A6B8B3; --ink-3:#869994; --line:#25413C;
  --band-1:#0A1828; --band-2:#12332F; --band-ink:#F2F7F5; --band-ink-2:#B9CCC6; --band-line:rgba(255,255,255,.13);
  --mint:#5CCB9F; --mint-ink:#72D8AE; --mint-soft:#15382E; --on-mint:#0B2A21;
  --crit:#F27058; --crit-soft:#3B1C16; --major:#E6A84A; --major-soft:#392A13; --minor:#7A9DF0; --minor-soft:#1A2744; --ofi:#94B7AB; --ofi-soft:#1B302A;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark; }

*{box-sizing:border-box}
html.locked{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band-1)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--font-display);font-weight:400}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--mint-ink)}
.muted{color:var(--ink-3);font-size:12.5px}
svg{flex-shrink:0}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:linear-gradient(100deg,var(--band-1),var(--band-2));color:var(--band-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:8px;min-height:56px}
.brand{display:flex;align-items:center;gap:9px}
.logo-chip{background:#fff;border-radius:6px;padding:4px 7px;display:flex;align-items:center;gap:5px}
.logo-chip b{width:11px;height:11px;border:2.5px solid #D9472E;border-radius:2px;display:block}
.logo-chip span{font-size:8.5px;line-height:1.05;color:#1b1b1b;font-weight:700}
.wordmark{font-family:var(--font-display);font-size:21px;letter-spacing:.01em}
.live-badge{font-size:9.5px;background:#4FB892;color:#0B2A21;font-weight:700;padding:2px 6px;border-radius:999px;margin-left:4px;letter-spacing:0.04em}
.tt{min-width:0;flex:1;line-height:1.25}
.tt .c{font-size:11.5px;color:var(--band-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .t{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.crumbs{display:none}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.top .icon-btn:hover{background:rgba(255,255,255,.1)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--on-mint);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex-shrink:0}

/* Sidebar (desktop only) */
.side{display:none}

/* Main */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.view{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.view.enter{animation:rise .24s var(--ease)}
@keyframes rise{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11.5px;font-weight:600;color:var(--ink-3);position:relative;min-height:52px;text-align:center}
.bn-ic{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background-color .2s}
.bn[aria-current="page"]{color:var(--ink)}
.bn[aria-current="page"] .bn-ic{background:var(--mint-soft);color:var(--mint-ink)}
.bn .cnt{position:absolute;top:0;left:calc(50% + 10px);background:var(--crit);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;min-width:18px;line-height:17px;padding:0 5px}

/* Home */
.hello h1{font-family:var(--font-display);font-weight:400;font-size:29px;line-height:1.12;margin-top:4px;text-wrap:balance}
.hello p{color:var(--ink-2);margin-top:2px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum-btn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:3px;min-height:70px;transition:border-color .15s}
.sum-btn:hover{border-color:var(--mint)}
.sum-btn .v{font-family:var(--font-display);font-size:28px;line-height:1}
.sum-btn .l{font-size:12px;color:var(--ink-2);font-weight:600;line-height:1.25}
.sum-btn.crit .v{color:var(--crit)} .sum-btn.warn .v{color:var(--major)}
.resume{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.resume .rt{flex:1;min-width:0}
.resume .rt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume .ri{width:34px;height:34px;border-radius:10px;background:var(--mint-soft);color:var(--mint-ink);display:grid;place-items:center}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head h2{font-family:var(--font-display);font-weight:400;font-size:23px}
.projects{display:flex;flex-direction:column;gap:12px}
.proj-tools{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px;color:var(--ink-3)}
.search:focus-within{border-color:var(--mint)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none;height:100%}
.search input::placeholder{color:var(--ink-3)}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px;scroll-snap-type:x proximity}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;scroll-snap-align:start;display:flex;gap:8px;align-items:center;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink-2);white-space:nowrap;transition:background-color .15s,color .15s}
.cat i{width:8px;height:8px;border-radius:50%;background:var(--st)}
.cat .n{font-size:12px;background:var(--surface-2);border-radius:999px;padding:0 8px;line-height:20px}
.cat[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cat[aria-selected="true"] .n{background:color-mix(in srgb,var(--surface) 22%,transparent)}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}

/* Project card */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.card:hover{border-color:color-mix(in srgb,var(--mint) 60%,var(--line))}
.card:has(.stretch:focus-visible){outline:2px solid var(--mint);outline-offset:2px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:.05em}
.card h3{font-size:17px;line-height:1.3;font-weight:700;margin-top:-4px}
.stretch:focus-visible{outline:none}
.stretch::after{content:"";position:absolute;inset:0;border-radius:18px}
.card-sub{margin-top:-8px;color:var(--ink-2);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-live{color:var(--mint-ink);background:var(--mint-soft)} .st-hold{color:var(--major);background:var(--major-soft)}
.st-upcoming{color:var(--minor);background:var(--minor-soft)} .st-completed{color:var(--ofi);background:var(--ofi-soft)}
.prog{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-radius:999px}
.prog b{font-size:13px;min-width:36px;text-align:right}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
dt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
dd{margin:0;font-weight:600;font-size:13.5px}
.note{font-size:13px;border-radius:10px;padding:8px 11px;color:var(--ink);line-height:1.4}
.note b{font-weight:700}
.note.hold{background:var(--major-soft)} .note.hold b{color:var(--major)}
.note.up{background:var(--minor-soft)} .note.up b{color:var(--minor)}
.note.done{background:var(--ofi-soft)} .note.done b{color:var(--ofi)}
.metrics{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.metric{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:1px;min-height:66px;transition:border-color .15s,background-color .15s}
.metric:hover{border-color:var(--mint);background:var(--surface)}
.metric .v{font-family:var(--font-display);font-size:24px;line-height:1.05}
.metric .l{font-size:12px;color:var(--ink-2);font-weight:600}
.metric .s{font-size:11.5px;font-weight:700;color:var(--crit)}
.metric.zero .v{color:var(--ink-3)}
.updated{font-size:12px;color:var(--ink-3)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--ink-2)}

/* Rows */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line);position:relative;color:var(--ink);transition:background-color .15s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--sev,transparent)}
.row svg{color:var(--ink-3)}
.rc{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.r1{font-size:12px;color:var(--ink-3);font-weight:600;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.r2{font-weight:600;font-size:14px;line-height:1.35}
.r3{font-size:12.5px;color:var(--ink-2)}
.r4{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.late{color:var(--crit);font-weight:700}
.sev{font-size:11px;font-weight:700;border-radius:6px;padding:0 7px;line-height:18px}
.sev-critical{color:var(--crit);background:var(--crit-soft)} .sev-major{color:var(--major);background:var(--major-soft)}
.sev-minor{color:var(--minor);background:var(--minor-soft)} .sev-ofi{color:var(--ofi);background:var(--ofi-soft)}
.stt{font-size:11.5px;font-weight:600;padding:0 9px;line-height:20px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.stt.bad{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.stt.good{background:var(--mint-soft);color:var(--mint-ink);border-color:transparent}
.stt.info{background:var(--minor-soft);color:var(--minor);border-color:transparent}

/* Project workspace */
.phero{border-radius:20px;padding:18px;color:var(--band-ink);display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(380px 220px at 100% 0%,rgba(79,184,146,.3),transparent 70%),linear-gradient(125deg,var(--band-1),var(--band-2))}
.phero .code{color:var(--band-ink-2)}
.phero h1{font-family:var(--font-display);font-weight:400;font-size:27px;line-height:1.12;text-wrap:balance}
.phero .sub{color:var(--band-ink-2);font-size:13px;margin-top:-6px}
.phero .bar{background:rgba(255,255,255,.14)}
.phero dt{color:var(--band-ink-2)}
.phero .updated{color:var(--band-ink-2)}
.ptabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:1 0 auto;padding:9px 12px;border-radius:10px;font-weight:600;color:var(--ink-2);font-size:13.5px;white-space:nowrap;text-align:center;transition:background-color .15s,color .15s}
.ptab .n{font-size:11.5px;margin-left:4px;opacity:.75}
.ptab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.block{display:flex;flex-direction:column;gap:10px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.block-h h2{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.link{color:var(--mint-ink);font-weight:700;font-size:13px}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pipe button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s}
.pipe button:hover{border-color:var(--mint)}
.pipe .v{font-family:var(--font-display);font-size:22px;line-height:1}
.pipe .l{font-size:11px;color:var(--ink-2);font-weight:600;line-height:1.2}
.pipe .hot{border-color:var(--mint);background:var(--mint-soft)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--mint-soft);border-color:var(--mint);color:var(--mint-ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column}
.seg button[aria-pressed="true"]{border-color:var(--mint);background:var(--mint-soft)}
.seg .v{font-family:var(--font-display);font-size:24px;line-height:1.05}
.seg .l{font-size:12px;color:var(--ink-2);font-weight:600}

/* Detail pages */
.dhead{display:flex;flex-direction:column;gap:8px}
.dhead .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dhead h1{font-family:var(--font-display);font-weight:400;font-size:27px;line-height:1.15;text-wrap:balance}
.ctxlink{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:13px;font-weight:600;color:var(--mint-ink);background:var(--mint-soft);border-radius:999px;padding:4px 12px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0}
.facts dd{overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:46px;padding:0 18px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 140px;transition:filter .15s,border-color .15s}
.btn.primary{background:var(--mint);color:var(--on-mint)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.ghost:hover{border-color:var(--mint)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{margin:0;aspect-ratio:4/3;max-width:100%;border-radius:12px;position:relative;overflow:hidden;

.photo.after{background:linear-gradient(90deg,transparent 47%,var(--photo-3) 47% 53%,transparent 53%) 0 0/100% 100%,radial-gradient(circle at 50% 40%,var(--photo-2) 0 1px,transparent 2px) 0 0/7px 7px,linear-gradient(140deg,var(--photo-2),var(--photo-1))}

.stamp{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:var(--stamp-bg);color:var(--stamp-ink);font-size:10.5px;line-height:1.35;font-variant-numeric:tabular-nums}

.tl li{position:relative;padding:0 0 16px 24px}
.tl li::before{content:"";position:absolute;left:0;top:5px;width:11px;height:11px;border-radius:50%;border:2px solid var(--mint);background:var(--surface)}
.tl li::after{content:"";position:absolute;left:5.5px;top:18px;bottom:2px;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::after{display:none}
.tl li:last-child::before{background:var(--mint)}
.tl .w{font-weight:600}
.tl .m{font-size:12.5px;color:var(--ink-2)}
.tl .d{font-size:12px;color:var(--ink-3)}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--dot)}
.lh{display:flex;flex-direction:column;gap:2px}
.lh h1{font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.1}
.ctxchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;align-self:flex-start;max-width:100%}
.ctxchip.on{background:var(--mint-soft);border-color:var(--mint);color:var(--mint-ink)}
.ctxchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86dvh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .3s var(--ease);box-shadow:0 -10px 40px rgba(0,0,0,.18);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.grab{padding:10px 0 6px;cursor:grab;touch-action:none;display:flex;justify-content:center}
.grab span{width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:2px 0 12px}
.sheet-head h2{font-family:var(--font-display);font-weight:400;font-size:23px;line-height:1.15}
.sheet-head .icon-btn{background:var(--surface);border:1px solid var(--line)}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-bottom:4px}
.sheet-foot{padding-top:12px}
.sheet-foot:empty{display:none}
.sub-h{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);z-index:30;max-width:calc(100% - 32px)}
.sample{font-size:12px;color:var(--ink-3);text-align:center;margin-top:8px}

@media (min-width:640px){

    padding:calc(18px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 22px}

/* QA Fix: Spinner Animation for Async Actions */
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}

/* QA Fix: Mobile Safe-Area Inset */
.bnav {
  padding-bottom: max(10px, env(safe-area-inset-bottom, 10px)) !important;
}

/* QA Fix: Form Inputs & Dark Theme Contrast */
input, select, textarea {
  color: var(--ink) !important;
  background-color: var(--surface) !important;
  border: 1px solid var(--line) !important;
  font-family: var(--font-body);
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--mint) !important;
  box-shadow: 0 0 0 2px var(--mint-soft);
}

/* QA Fix: Responsive Card Actions */
.card-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
@media (max-width: 440px) {
  .card-actions .btn {
    flex: 1 1 calc(50% - 4px);
    text-align: center;
    justify-content: center;
  }
}

/* ==========================================================================
   MOBILE-FIRST RESPONSIVE OPTIMIZATIONS (iOS / Android / PWA)
   ========================================================================== */
html, body {
  max-width: 100vw;
  overflow-x: hidden;
}

/* AI Report Table Horizontal Scrolling on Mobile */
.report-content table {
  display: block;
  max-width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.report-content pre {
  max-width: 100%;
  overflow-x: auto;
}

/* Mobile Status Pipeline Horizontal Rail */
@media (max-width: 640px) {
  .pipe {
    display: flex !important;
    overflow-x: auto !important;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 2px 0 6px !important;
    gap: 8px !important;
  }
  .pipe::-webkit-scrollbar { display: none; }
  .pipe button {
    flex: 0 0 105px !important;
    min-width: 105px !important;
    scroll-snap-align: start;
  }
  
  /* Prevent iOS Safari Viewport Auto-Zoom on Input Focus */
  input, select, textarea {
    font-size: 16px !important;
  }
  
  /* Touch Ergonomics for Main Buttons */
  .btn {
    min-height: 44px;
  }
}

/* Top Bar Mobile Optimization: Sleek branding and role switcher */
@media (max-width: 640px) {
  .brand .wordmark {
    display: none !important;
  }
}
@media (max-width: 520px) {
  .role-badge-name {
    display: none !important;
  }
  .switch-role-text {
    display: none !important;
  }
  .switch-role-btn {
    padding: 0 8px !important;
    min-width: 32px !important;
    height: 32px !important;
    justify-content: center !important;
  }
}
@media (max-width: 440px) {
  .brand .live-badge {
    display: none !important;
  }
  .facts {
    grid-template-columns: 1fr !important;
    gap: 10px !important;
    padding: 12px !important;
  }
}
@media (max-width: 380px) {
  .top-in {
    gap: 4px !important;
  }
  .avatar {
    width: 30px !important;
    height: 30px !important;
    font-size: 11px !important;
  }
  .sum-btn {
    padding: 8px 6px !important;
    min-height: 60px !important;
  }
  .sum-btn .v {
    font-size: 22px !important;
  }
  .sum-btn .l {
    font-size: 11px !important;
  }
}

/* Engineer Workspace Summary Metrics (Responsive Grid) */
.sum-engineer {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
}
@media (max-width: 768px) {
  .sum-engineer {
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    gap: 8px !important;
  }
}
@media (max-width: 440px) {

    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 8px !important;
  }
}

/* Responsive Cards Layout */
.cards-responsive {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}
@media (max-width: 640px) {
  .cards-responsive {
    grid-template-columns: 1fr !important;
    gap: 12px !important;
  }

/* Field Engineer Sticky Execution Bar — Stays above mobile bottom nav */
.execution-sticky-bar {
  position: sticky;
  bottom: 12px;
  z-index: 10;
  background: color-mix(in srgb, var(--surface) 95%, transparent);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
@media (max-width: 959px) {
  .execution-sticky-bar {
    bottom: calc(68px + env(safe-area-inset-bottom, 8px)) !important;
  }
}

/* Touch-optimized Checkpoint Evaluation Buttons */
.chk-eval-btn {
  height: 36px;
  padding: 0 16px;
  font-size: 12.5px;
  font-weight: 800;
  border-radius: 8px;
  flex: 1 1 0;
  min-width: 68px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
}
@media (max-width: 480px) {
  .chk-eval-btn {
    height: 42px !important;
    font-size: 13.5px !important;
  }
}

/* Wizard Foot Actions on Mobile */
.wizard-foot-actions {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
}
@media (max-width: 480px) {
  .wizard-foot-actions {
    flex-wrap: wrap !important;
  }
  .wizard-foot-actions .btn {
    flex: 1 1 calc(50% - 4px) !important;
  }
  .wizard-foot-actions .btn.primary {
    flex: 1 1 100% !important;
    order: -1 !important;
  }
}

/* Bottom Sheet mobile height & inertia */
@media (max-width: 959px) {
  .sheet {
    max-height: 92dvh !important;
    border-radius: 20px 20px 0 0 !important;
  }
  .sheet-body {
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
}

/* ==========================================================================

   ========================================================================== */
.login-gateway-backdrop {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: radial-gradient(ellipse at 50% 35%, #D6EFE5 0%, #C4E5D8 45%, #AFDACB 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  overflow-y: auto;
}

/* Subtle architectural isometric background lines matching screenshot */
.login-isometric-bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.35;
  background-image: 
    radial-gradient(circle at 15% 25%, rgba(255,255,255,0.7) 0%, transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(255,255,255,0.6) 0%, transparent 50%),
    linear-gradient(30deg, rgba(32, 122, 97, 0.08) 12%, transparent 12.5%, transparent 87%, rgba(32, 122, 97, 0.08) 87.5%),
    linear-gradient(150deg, rgba(32, 122, 97, 0.08) 12%, transparent 12.5%, transparent 87%, rgba(32, 122, 97, 0.08) 87.5%),
    linear-gradient(30deg, rgba(32, 122, 97, 0.08) 12%, transparent 12.5%, transparent 87%, rgba(32, 122, 97, 0.08) 87.5%),
    linear-gradient(150deg, rgba(32, 122, 97, 0.08) 12%, transparent 12.5%, transparent 87%, rgba(32, 122, 97, 0.08) 87.5%),
    linear-gradient(60deg, rgba(32, 122, 97, 0.05) 25%, transparent 25.5%, transparent 75%, rgba(32, 122, 97, 0.05) 75%),
    linear-gradient(60deg, rgba(32, 122, 97, 0.05) 25%, transparent 25.5%, transparent 75%, rgba(32, 122, 97, 0.05) 75%);
  background-size: 80px 140px;
}

.landing-hero {
  text-align: center;
  padding: 40px 16px 60px;
  max-width: 900px;
  margin: 0 auto;
}
.landing-hero h1 {
  font-family: var(--font-display);
  font-size: clamp(34px, 5vw, 54px);
  font-weight: 400;
  line-height: 1.15;
  color: var(--ink);
  letter-spacing: -0.02em;
  margin-bottom: 20px;
}
.landing-hero p {
  font-size: clamp(16px, 2vw, 19px);
  line-height: 1.6;
  color: var(--ink-2);
  margin: 0 auto 32px;
  max-width: 760px;
}
.landing-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
}
.landing-btn-primary {
  height: 50px;
  padding: 0 28px;
  background: var(--mint);
  color: var(--on-mint);
  font-size: 15px;
  font-weight: 700;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 8px 24px rgba(79, 184, 146, 0.35);
  transition: all 0.2s cubic-bezier(.2, .8, .2, 1);
}
.landing-btn-primary:hover {
  transform: translateY(-2px);
  filter: brightness(1.06);
}
.landing-btn-ghost {
  height: 50px;
  padding: 0 24px;
  background: var(--surface);
  color: var(--ink);
  font-size: 15px;
  font-weight: 700;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s cubic-bezier(.2, .8, .2, 1);
}
.landing-btn-ghost:hover {
  border-color: var(--mint);
  background: var(--surface-2);
}

.landing-section {
  margin-top: 60px;
}
.landing-section-head {
  text-align: center;
  margin-bottom: 36px;
}
.landing-section-head h2 {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 400;
  color: var(--ink);
  margin-bottom: 10px;
}
.landing-section-head p {
  font-size: 15px;
  color: var(--ink-2);
  max-width: 600px;
  margin: 0 auto;
}

.hierarchy-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
}
.hierarchy-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 28px;
  position: relative;
  transition: all 0.2s cubic-bezier(.2, .8, .2, 1);
  box-shadow: 0 4px 16px rgba(0,0,0,0.03);
}
.hierarchy-card:hover {
  border-color: var(--mint);
  transform: translateY(-3px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.07);
}
.hierarchy-step-num {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--mint-soft);
  color: var(--mint-ink);
  font-weight: 800;
  font-size: 14px;
  display: grid;
  place-items: center;
  margin-bottom: 16px;
}

/* User profile popover */
.profile-popover {
  position: absolute;
  top: 56px;
  right: 16px;
  width: 290px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.12);
  z-index: 1000;
  animation: loginCardEnter 0.18s cubic-bezier(.2, .8, .2, 1);
}

/* Admin Console Styles */
.admin-stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.admin-stat-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.admin-stat-val {
  font-family: var(--font-num);
  font-size: 32px;
  font-weight: 800;
  color: var(--ink);
}
.admin-stat-lbl {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-2);
}

.admin-members-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
}
.admin-members-table th {
  background: var(--surface-2);
  padding: 12px 16px;
  font-size: 11.5px;
  font-weight: 800;
  color: var(--ink-2);
  text-align: left;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--line);
}
.admin-members-table td {
  padding: 14px 16px;
  font-size: 13.5px;
  color: var(--ink);
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.admin-members-table tr:last-child td {
  border-bottom: none;
}
.admin-members-table tr:hover td {
  background: rgba(79, 184, 146, 0.03);
}

/* Landing Page Fullscreen Mode */
body.landing-mode .side { display: none !important; }
body.landing-mode .shell { margin-left: 0 !important; }
body.landing-mode .bnav { display: none !important; }
body.landing-mode .top .brand { display: flex !important; }
body.landing-mode .top .crumbs { display: none !important; }
body.landing-mode #backBtn { display: none !important; }
body.landing-mode main { max-width: 1200px; margin: 0 auto; padding-top: 10px; }

/* ---------- derived & helpers ---------- */
const SEVO = {critical:0,major:1,minor:2,ofi:3};
const SEVL = {critical:'Critical',major:'Major',minor:'Minor',ofi:'OFI'};
const SEVV = {critical:'--crit',major:'--major',minor:'--minor',ofi:'--ofi'};
const STL = {live:'Live',hold:'On hold',upcoming:'Upcoming',completed:'Completed'};
const INS_ST = ['Required','Allocated','In progress','Pending review','Report issued'];
const MODS = {home:'Home',inspections:'Inspections',ncs:'NCs',approvals:'Approvals'};
const isOpen = n => n.status !== 'Closed';
const openN = p => (p.ncs || []).filter(isOpen);
const closedN = p => (p.ncs || []).filter(n => !isOpen(n));
const closedTotal = p => closedN(p).length + (p.closedExtra || 0);
const ncLate = n => isOpen(n) && ago(n.due) > 0;
const insLate = i => ['Required','Allocated','In progress'].includes(i.status) && ago(i.due) > 0;
const actLate = t => ago(t.due) > 0;
const byId = id => P.find(p => p.id === id);
const find = (key, code) => { for (const p of P) { const x = (p[key] || []).find(o => o.code === code); if (x) return {x, p}; } return null; };
const sortNC = (a,b) => (isOpen(b.n) - isOpen(a.n)) || SEVO[a.n.sev] - SEVO[b.n.sev] || d0(a.n.due) - d0(b.n.due);
const allNC = () => P.flatMap(p => (p.ncs || []).map(n => ({n,p})));
const critOpen = () => allNC().filter(o => isOpen(o.n) && o.n.sev === 'critical');
const allApprovals = () => P.flatMap(p => (p.approvals || []).map(a => ({a,p})));
const overdueNC = () => allNC().filter(o => ncLate(o.n));
const overdueIns = () => P.flatMap(p => (p.ins || []).filter(insLate).map(i => ({i,p})));
const engLoad = name => P.reduce((a,p) => a + (p.ins || []).filter(i => i.eng === name && ['Allocated','In progress'].includes(i.status)).length, 0);
const projOf = e => e.v === 'project' ? e.id : e.v === 'nc' ? find('ncs', e.id)?.p.id : e.v === 'approval' ? find('approvals', e.id)?.p.id : e.v === 'inspection' ? find('ins', e.id)?.p.id : null;

function trail(n){
  const t = [], cap = s => d0(s) > TD ? TODAY_ISO : s;
  t.push({d:n.raised, w:`Raised by ${n.by}`, m:`${SEVL[n.sev]} · ${n.zone} · ${n.trade}`});
  if (n.status !== 'Open') t.push({d:n.raised, w:`Assigned to ${n.assigned}`, m:`Due ${fmt(n.due)}`});
  if (['Rectification submitted','Under verification','Reopened','Closed'].includes(n.status)) t.push({d:cap(addDays(n.raised,3)), w:'Rectification submitted', m:`${n.assigned} uploaded root cause and after-photos`});
  if (['Under verification','Reopened','Closed'].includes(n.status)) t.push({d:cap(addDays(n.raised,4)), w:`Re-inspection by ${n.by}`, m: n.status === 'Reopened' ? 'Defect persists. Verification failed.' : 'Verified on site with closing photo'});
  if (n.status === 'Reopened') t.push({d:cap(addDays(n.raised,4)), w:'Reopened', m:`Back with ${n.assigned}`});
  (n.log || []).forEach(l => t.push(l));
  if (n.status === 'Closed') t.push({d:n.closed || TODAY_ISO, w:'Closed by Priya Deshmukh', m:'Closure = Y'});
  return t;
}

async function handleRealLoginSubmit(ev) {
  ev.preventDefault();
  const email = $('loginEmailInput')?.value.trim();
  const password = $('loginPasswordInput')?.value;
  const orgId = LOGIN_GATEWAY_STATE.selectedOrgId;
  const errBox = $('loginErrorMessage');
  const submitBtn = $('loginSubmitBtn');

  if (errBox) errBox.style.display = 'none';
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Verifying credentials...';
  }

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, org_id: orgId })
    });

    const data = await res.json();
    if (!res.ok || data.status !== 'success') {
      throw new Error(data.detail || 'Authentication failed. Please verify credentials.');
    }

    // Securely persist JWT token, user profile, and verified organization
    localStorage.setItem('siteiq_jwt_token', data.access_token);
    localStorage.setItem('siteiq_user_profile', JSON.stringify(data.user));
    localStorage.setItem('siteiq_user_org', JSON.stringify(data.organization));
    localStorage.setItem('siteiq_logged_in_role', data.user.role);
    if (data.user.employee_id) {
      localStorage.setItem('siteiq_active_engineer_id', data.user.employee_id);
    }

    S.role = data.user.role;
    _storedEngId = data.user.employee_id || 'EMP-1004';

    closeLoginGateway();
    if (typeof toast === 'function') {
      toast(`Signed in as ${data.user.full_name} (${data.organization.name})`);
    }

    // Refresh data with multi-tenant isolation
    await syncFromBackend();

    if (data.user.role === 'engineer') {
      if (typeof ENGINEER_WORKSPACE !== 'undefined') {
        ENGINEER_WORKSPACE.activeEngineerId = data.user.employee_id || 'EMP-1004';
        ENGINEER_WORKSPACE.activeEngineerName = data.user.full_name;
      }
      S.stack = [{ v: 'engineer_dashboard' }];
      if (window.history && window.history.pushState) window.history.pushState(null, '', '/engineer');
      if (typeof fetchEngineerDashboardData === 'function') {
        fetchEngineerDashboardData(data.user.employee_id).then(() => render());
      } else {
        render();
      }
    } else if (data.user.role === 'admin') {
      S.stack = [{ v: 'admin_dashboard' }];
      if (window.history && window.history.pushState) window.history.pushState(null, '', '/admin');
      render();
    } else {
      S.stack = [{ v: 'home' }];
      if (window.history && window.history.pushState) window.history.pushState(null, '', '/qc');
      render();
    }
  } catch(err) {
    if (errBox) {
      errBox.textContent = err.message;
      errBox.style.display = 'block';
    }
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Authenticate & Launch Workspace →';
    }
  }
}

/* ---------- shared fragments ---------- */
const pill = st => `<span class="pill st-${st}">${STL[st] || st}</span>`;
const stTag = s => { const c = s === 'Reopened' ? 'bad' : s === 'Closed' || s === 'Report issued' ? 'good' : ['Rectification submitted','Under verification','Pending review'].includes(s) ? 'info' : ''; return `<span class="stt ${c}">${s}</span>`; };
const dueText = (due, late, closedOn) => closedOn ? `Closed ${fmt(closedOn,false)}` : late ? `<span class="late">${ago(due)} d overdue</span>` : ago(due) === 0 ? '<span class="late">Due today</span>' : `Due ${fmt(due,false)}`;
const metric = (sheet, v, l, s) => `<button class="metric ${v ? '' : 'zero'}" type="button" data-sheet="${sheet}" aria-label="${v} ${l}${s ? ', ' + s : ''}"><span class="v num">${v}</span><span class="l">${l}</span>${s ? `<span class="s">${s}</span>` : ''}</button>`;
function metricsFor(p){
  const o = openN(p), crit = o.filter(n => n.sev === 'critical').length, late = o.filter(ncLate).length, aLate = (p.actions || []).filter(actLate).length;
  return `<div class="metrics">${metric(`ncs:${p.id}`, o.length, 'Open NCs', crit ? `${crit} critical` : late ? `${late} overdue` : '')}${metric(`approvals:${p.id}`, (p.approvals || []).length, 'Approvals', '')}${metric(`actions:${p.id}`, (p.actions || []).length, 'Actions', aLate ? `${aLate} overdue` : '')}</div>`;
}
function ncRow(n, p, showP){
  return `<button class="row" type="button" data-go="nc:${n.code}" style="--sev:var(${SEVV[n.sev]})">
    <span class="rc"><span class="r1">${n.code}${showP ? ` · ${esc(p.name)}` : ''}<span class="sev sev-${n.sev}">${SEVL[n.sev]}</span></span>
    <span class="r2">${esc(n.title)}</span>
    <span class="r3">${esc(n.assigned)} · ${dueText(n.due, ncLate(n), isOpen(n) ? null : n.closed)}</span>
    <span class="r4">${stTag(n.status)}</span></span>${ico('chev',18)}</button>`;
}
function apRow(a, p, showP){
  return `<button class="row" type="button" data-go="approval:${a.code}">
    <span class="rc"><span class="r1">${a.kind}${showP ? ` · ${esc(p.name)}` : ''}</span>
    <span class="r2">${esc(a.title)}</span><span class="r3">${esc(a.by)} · submitted ${rel(a.at)}</span></span>${ico('chev',18)}</button>`;
}
function goOf(t){ const g = t.target; return g.nc ? `nc:${g.nc}` : g.ins ? `inspection:${g.ins}` : `project:${g.project}:inspections`; }
function acRow(t, p, showP){
  return `<button class="row" type="button" data-go="${goOf(t)}" style="--sev:${actLate(t) ? 'var(--crit)' : 'transparent'}">
    <span class="rc"><span class="r1">Action${showP ? ` · ${esc(p.name)}` : ''}</span>
    <span class="r2">${esc(t.title)}</span><span class="r3">${esc(t.detail)} · ${dueText(t.due, actLate(t))}</span></span>${ico('chev',18)}</button>`;
}
function getInspectionTab(status) {
  const s = String(status || '').toLowerCase().trim();
  if (['draft', 'created', 'allocated', 'required'].includes(s)) return 'Create';
  if (['in progress', 'in_progress', 'pending review', 'pending_review'].includes(s)) return 'In Progress';
  if (['on hold', 'on_hold', 'returned for reinspection', 'returned'].includes(s)) return 'On Hold';
  if (['completed', 'done', 'report issued', 'closed'].includes(s)) return 'Completed';
  return 'Create';
}

function insRow(i, p, showP){
  const isAlloc = i.code && (i.code.startsWith('ALC-') || i.code.startsWith('INS-'));
  const chkCount = i.items_count || (i.res ? i.res.items : (isAlloc ? 1 : null));
  const pri = i.priority || (isAlloc ? 'High' : 'High');
  const priColor = pri === 'High' ? 'var(--crit)' : pri === 'Medium' ? 'var(--major)' : 'var(--mint-ink)';
  const priBg = pri === 'High' ? 'var(--crit-soft)' : pri === 'Medium' ? 'var(--major-soft)' : 'var(--mint-soft)';
  const priBadge = `<span style="font-size:10px; font-weight:800; padding:1px 6px; border-radius:4px; background:${priBg}; color:${priColor}; text-transform:uppercase">${pri}</span>`;

  let progressPct = 0;
  if (i.res && i.res.items) {
    const done = (i.res.pass || 0) + (i.res.nc || 0) + (i.res.na || 0);
    progressPct = Math.round((done / i.res.items) * 100);
  } else if (i.status === 'Report issued' || i.status === 'Done') {
    progressPct = 100;
  } else if (i.status === 'Pending review') {
    progressPct = 100;
  } else if (i.status === 'In progress') {
    progressPct = 50;
  }

  const stClass = ['Report issued', 'Done'].includes(i.status) ? 'good' : ['Pending review', 'In progress'].includes(i.status) ? 'info' : ['On hold', 'Returned for Reinspection', 'Returned'].includes(i.status) ? 'bad' : '';

  return `
    <article class="card" style="position:relative; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; display:flex; flex-direction:column; gap:10px">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px">
        <div>
          <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:4px">
            <span class="code" style="font-weight:800; color:var(--mint); font-size:12.5px">${i.code}</span>
            ${showP ? `<span style="font-size:12px; font-weight:700">· ${esc(p.name)}</span>` : ''}
            ${priBadge}
            <span class="stt ${stClass}">${i.status}</span>
          </div>
          <h3 style="font-size:15px; font-weight:700; margin:0; line-height:1.3">
            <a href="javascript:void(0)" onclick="push('inspection:${i.code}')" style="color:inherit; text-decoration:none">${esc(i.title)}</a>
            ${i.tpl ? `<span class="muted" style="font-weight:400; font-size:12.5px">· ${esc(i.tpl)}</span>` : ''}
          </h3>
        </div>
        ${chkCount ? `<span class="pill" style="font-size:11px; font-weight:700; background:var(--mint-soft); color:var(--mint-ink); flex-shrink:0">${chkCount} Checkpoints</span>` : ''}
      </div>

      <div style="background:var(--surface-2); border-radius:8px; padding:8px 10px; font-size:12px; display:grid; grid-template-columns:1fr 1fr; gap:6px">
        <div><strong>Location:</strong> ${esc(i.zone || 'General Site')}</div>
        <div><strong>Engineer:</strong> <strong style="color:var(--mint)">${esc(i.eng || 'Unassigned')}</strong></div>
        <div><strong>Schedule:</strong> ${dueText(i.due, insLate(i), ['Report issued', 'Done'].includes(i.status) ? i.due : null)}</div>
        <div><strong>Progress:</strong> <span class="num">${progressPct}%</span></div>
      </div>

      <div class="prog" style="margin:0; height:6px"><div class="bar"><i style="width:${progressPct}%"></i></div></div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px; flex-wrap:wrap; gap:6px">
        <div style="display:flex; gap:6px">
          <button class="btn primary" type="button" onclick="push('inspection:${i.code}')" style="height:30px; padding:0 12px; font-size:11.5px; font-weight:700">
            View Inspection →
          </button>
          <button class="btn ghost" type="button" onclick="openChangeEngineerModal('${i.code}')" style="height:30px; padding:0 10px; font-size:11.5px; font-weight:700; border:1px solid var(--line)">
            👤 Change Inspection Engineer
          </button>
        </div>
        ${i.status === 'Pending review' ? `
          <button class="btn ghost" type="button" onclick="push('inspection:${i.code}')" style="height:30px; padding:0 10px; font-size:11px; color:var(--mint); font-weight:800; border:1px solid var(--mint)">
            ⚡ Review Report
          </button>

          <button class="btn ghost" type="button" onclick="openCreateInspectionWizard('${p.id}', '${i.code}')" style="height:30px; padding:0 10px; font-size:11px; color:var(--major); font-weight:800; border:1px solid var(--major)">
            ✏️ Continue Setup
          </button>
        ` : ''}
      </div>
    </article>
  `;
}

function renderCards(){
  const q = S.q.trim().toLowerCase(), cnt = {live:0,hold:0,upcoming:0,completed:0};
  P.forEach(p => { if (cnt[p.status] !== undefined) cnt[p.status]++; });
  const catsEl = $('cats');
  if (catsEl) {
    catsEl.innerHTML = Object.keys(STL).map(k => `<button class="cat" type="button" role="tab" aria-selected="${!q && S.cat === k}" data-cat="${k}" style="--st:var(--st-${k})"><i></i>${STL[k]}<span class="n num">${cnt[k] || 0}</span></button>`).join('');
  }
  const list = q ? P.filter(p => `${p.name} ${p.code} ${p.loc} ${p.type}`.toLowerCase().includes(q)) : P.filter(p => p.status === S.cat);
  const cardsEl = $('cards');
  if (cardsEl) {
    cardsEl.innerHTML = list.length ? list.map(card).join('') : `<div class="empty">${q ? `No projects match “${esc(S.q)}”.` : `No ${STL[S.cat].toLowerCase()} projects.`}</div>`;
  }
}

function card(p){
  let mid = '';
  if (p.status === 'upcoming') mid = `<p class="note up"><b>Starts ${fmt(p.start)}.</b> In ${-ago(p.start)} days.</p>`;
  else if (p.status === 'completed') mid = `<p class="note done"><b>Cleared ${fmt(p.cleared)}.</b> ${closedTotal(p)} NCs closed.</p>`;
  else mid = `<div class="prog"><div class="bar" role="progressbar" aria-label="Progress" aria-valuenow="${p.progress}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p.progress}%"></i></div><b class="num">${p.progress}%</b></div>`;
  return `<article class="card">
    <div class="card-top"><span class="code">${p.code}</span>${pill(p.status)}</div>
    <h3><button class="stretch" type="button" data-go="project:${p.id}">${esc(p.name)}</button></h3>
    <p class="card-sub">${p.type} · ${esc(p.loc)}</p>
    ${p.status === 'hold' ? `<p class="note hold"><b>On hold.</b> ${esc(p.hold)}</p>` : ''}${mid}
    <dl class="dates"><div><dt>Planned start</dt><dd>${fmt(p.start)}</dd></div><div><dt>Completion</dt><dd>${fmt(p.end)}</dd></div></dl>
    ${metricsFor(p)}
    <p class="updated">Updated ${rel(p.upd[0])} · ${esc(p.upd[1])}</p>
  </article>`;
}

  return `<section class="phero">
      <div class="card-top"><span class="code">${p.code}</span>${pill(p.status)}</div>
      <h1>${esc(p.name)}</h1><p class="sub">${p.type} · ${esc(p.loc)}</p>
      ${p.status === 'live' || p.status === 'hold' ? `<div class="prog"><div class="bar"><i style="width:${p.progress}%"></i></div><b class="num">${p.progress}%</b></div>` : ''}
      <dl class="dates"><div><dt>Planned start</dt><dd>${fmt(p.start)}</dd></div><div><dt>Completion</dt><dd>${fmt(p.end)}</dd></div></dl>

  else if (n.status === 'Under verification') btns = `<button class="btn primary" type="button" data-act="close:${n.code}">Close NC</button><button class="btn ghost" type="button" data-act="reopen:${n.code}">Reopen</button>`;

          ${after ? `<figure class="photo after"><span class="ptag">After</span><figcaption class="stamp">${p.geo}<br>${fmt(d0(addDays(n.raised,3)) > TD ? TODAY_ISO : addDays(n.raised,3))} · 16:08 · Contractor</figcaption></figure>` : `<div class="empty" style="display:grid;place-items:center;padding:12px;font-size:12.5px">After-photo pending from contractor</div>`}

        <ol class="tl">${trail(n).map(t => `<li><div class="w">${esc(t.w)}</div><div class="m">${esc(t.m)}</div><div class="d">${fmt(t.d)}</div></li>`).join('')}</ol>

VIEWS.approval = e => {
  const f = find('approvals', e.id); if (!f) return gone('approval');

  if (a.nc){ const n = (p.ncs || []).find(x => x.code === a.nc); if (n) extra = `<div class="block"><div class="block-h"><h2>NC to close</h2></div>${rows([ncRow(n,p)])}</div>`; }
  if (!a.ins && !a.nc) extra = `<section class="panel"><h2 class="sub-h">Summary</h2><p>Inspection and test plan for all civil, façade and MEP stages, with hold and witness points mapped to checklist templates. Approving it publishes the plan and lets you schedule inspections against it.</p></section>`;
  return `<section class="dhead">
      <button class="ctxlink" type="button" data-go="project:${p.id}:approvals">${esc(p.name)} ${ico('chev',14)}</button>
      <div class="tags"><span class="code">${a.code}</span><span class="stt info">${a.kind}</span></div>
      <h1>${esc(a.title)}</h1>
    </section>
    <div class="actions"><button class="btn primary" type="button" data-act="approve:${a.code}">Approve</button><button class="btn ghost" type="button" data-act="return:${a.code}">Return with comments</button></div>
    <dl class="facts"><div><dt>Submitted by</dt><dd>${esc(a.by)}</dd></div><div><dt>Submitted</dt><dd>${fmt(a.at)} · ${rel(a.at)}</dd></div><div><dt>Reference</dt><dd>${a.ins || a.nc || 'ITP Rev 0'}</dd></div></dl>
    ${extra}`;
};

function resBar(r){
  if (!r || !r.items) return '';
  const w = x => (x / r.items * 100).toFixed(1) + '%';
  return `<div class="stack" role="img" aria-label="${r.pass} pass, ${r.nc} NC, ${r.na} not applicable"><i style="width:${w(r.pass)};background:var(--mint)"></i><i style="width:${w(r.nc)};background:var(--crit)"></i><i style="width:${w(r.na)};background:var(--ink-3)"></i></div>
    <div class="legend"><span style="--dot:var(--mint)">${r.pass} pass</span><span style="--dot:var(--crit)">${r.nc} NC</span><span style="--dot:var(--ink-3)">${r.na} N/A</span><span>Compliance ${Math.round(r.pass / (r.pass + r.nc || 1) * 100)}%</span></div>`;
}

VIEWS.inspection = e => {
  const f = find('ins', e.id); if (!f) return gone('inspection');
  const i = f.x, p = f.p, ap = (p.approvals || []).find(a => a.ins === i.code);
  const isAlloc = i.code && i.code.startsWith('ALC-');
  const alloc = typeof ALLOCATIONS_CACHE !== 'undefined' ? ALLOCATIONS_CACHE[i.code] : null;

  // If allocation details are not yet in client cache, fetch asynchronously
  if (isAlloc && !alloc) {
    fetch(`/api/allocations/${i.code}`).then(r => r.json()).then(d => {
      if (d.status === 'success' && d.allocation) {
        ALLOCATIONS_CACHE[i.code] = d.allocation;
        if (cur().v === 'inspection' && cur().id === i.code) render(false);
      }
    }).catch(()=>{});
  }

  let btns = '';
  const changeEngBtn = `<button class="btn ghost" type="button" onclick="openChangeEngineerModal('${i.code}')">👤 Change Inspection Engineer</button>`;
  if (['Draft','Required'].includes(i.status)) btns = `<button class="btn primary" type="button" onclick="openCreateInspectionWizard('${p.id}', '${i.code}')">Edit Inspection</button>${changeEngBtn}`;
  else if (i.status === 'Pending review' && ap) btns = `<button class="btn primary" type="button" data-go="approval:${ap.code}">Review report</button>${changeEngBtn}`;
  else if (['Allocated','In progress'].includes(i.status)) btns = `<button class="btn primary" type="button" onclick="openAllocationDetail('${i.code}')" style="background:var(--mint); color:var(--on-mint)">📋 Inspect Checkpoints</button><button class="btn ghost" type="button" data-act="nudge:${i.code}">${insLate(i) ? 'Chase engineer' : 'Send reminder'}</button>${changeEngBtn}`;
  else btns = changeEngBtn;

  const aiReportBtn = `<button class="btn" type="button" data-act="genReport:${i.code}" style="background:linear-gradient(135deg, var(--band-1), var(--band-2)); color:#5CCB9F; border:1px solid #4FB892; font-weight:700">✨ Generate Detailed AI Audit Report</button>
  <button class="btn ghost" type="button" data-sheet="report:${i.code}">📄 View Report</button>`;

  // Render allocated checkpoints breakdown if available
  let allocatedCheckpointsSection = '';
  if (alloc && alloc.checkpoints && alloc.checkpoints.length) {
    const chkListHtml = alloc.checkpoints.map(chk => {
      const priColor = chk.priority === 'H' ? 'var(--crit)' : chk.priority === 'M' ? 'var(--major)' : 'var(--mint-ink)';
      const priBg = chk.priority === 'H' ? 'var(--crit-soft)' : chk.priority === 'M' ? 'var(--major-soft)' : 'var(--mint-soft)';

      let photosHtml = '';
      if (chk.evidence_photo_url) {
        let photos = [];
        try {
          if (chk.evidence_photo_url.startsWith('[')) photos = JSON.parse(chk.evidence_photo_url);
          else photos = chk.evidence_photo_url.split(',').map(s => s.trim()).filter(Boolean);
        } catch(e) { photos = [chk.evidence_photo_url]; }
        if (photos.length) {
          photosHtml = `
            <div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap">
              ${photos.map(u => `
                <img src="${u}" alt="Evidence" style="width:54px; height:54px; object-fit:cover; border-radius:6px; border:1px solid var(--line); cursor:pointer" onclick="window.open('${u}','_blank')">
              `).join('')}
            </div>
          `;
        }
      }

      const obsHtml = chk.observations ? `
        <div style="font-size:12px; margin-top:6px; padding:6px 10px; border-radius:6px; background:${chk.result_status === 'NC' ? 'var(--crit-soft)' : 'var(--surface-2)'}; color:${chk.result_status === 'NC' ? 'var(--crit)' : 'var(--ink)'}; line-height:1.4">
          <strong>${chk.result_status === 'NC' ? 'Defect Observation' : chk.result_status === 'NA' ? 'NA Justification' : 'Engineer Notes'}:</strong> ${esc(chk.observations)}
        </div>
      ` : '';

      return `
        <div style="padding:12px 14px; border-bottom:1px solid var(--line)">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px">
            <div style="flex:1; min-width:0">
              <div style="display:flex; gap:6px; align-items:center; margin-bottom:3px">
                <span style="font-size:10px; font-weight:800; padding:1px 5px; border-radius:4px; background:${priBg}; color:${priColor}">[${chk.priority}]</span>
                <span class="code" style="font-size:11px">${chk.checkpoint_id}</span>
                <span style="font-size:11px; color:var(--ink-3)">${chk.subgroup_name || ''}</span>
              </div>

VIEWS.list = e => {

  let head = '', body = '';
  if (mod === 'ncs'){
    const L = S.listNc, src = scope.flatMap(p => (p.ncs || []).map(n => ({n,p}))).filter(o => isOpen(o.n) !== L.closed);
    const list = src.filter(o => L.sev === 'all' || o.n.sev === L.sev).sort(sortNC);
    head = `${src.length} ${L.closed ? 'closed' : 'open'}`;
    body = `<div class="chips" role="group" aria-label="Filters"><button class="chip" type="button" data-lnc="open" aria-pressed="${!L.closed}">Open</button><button class="chip" type="button" data-lnc="closed" aria-pressed="${L.closed}">Closed</button>
      ${['all','critical','major','minor','ofi'].map(s => `<button class="chip" type="button" data-lsev="${s}" aria-pressed="${L.sev === s}">${s === 'all' ? 'All severities' : SEVL[s]}</button>`).join('')}</div>
      ${rows(list.map(o => ncRow(o.n,o.p,showP)), 'No NCs match these filters.')}`;
  } else if (mod === 'approvals'){
    const list = scope.flatMap(p => (p.approvals || []).map(a => ({a,p})));
    head = `${list.length} waiting`;
    body = rows(list.map(o => apRow(o.a,o.p,showP)), 'Nothing waiting for your approval.');
  } else {
    S.listInsTab = S.listInsTab || 'Create';
    const activeTab = S.listInsTab;
    const src = scope.flatMap(p => (p.ins || []).map(i => ({i,p})));
    const counts = {
      'Create': src.filter(o => getInspectionTab(o.i.status) === 'Create').length,
      'In Progress': src.filter(o => getInspectionTab(o.i.status) === 'In Progress').length,
      'On Hold': src.filter(o => getInspectionTab(o.i.status) === 'On Hold').length,
      'Completed': src.filter(o => getInspectionTab(o.i.status) === 'Completed').length,
    };
    const list = src.filter(o => getInspectionTab(o.i.status) === activeTab).sort((a,b) => d0(a.i.due) - d0(b.i.due));
    
    // Needs Attention section for Pending review, Overdue, On hold, Returned
    const attentionItems = src.filter(o => ['Pending review', 'On hold', 'Returned for Reinspection', 'Returned'].includes(o.i.status) || insLate(o.i)).slice(0, 3);
    let attentionBanner = '';
    if (attentionItems.length > 0) {
      attentionBanner = `
        <div style="background:var(--warn-soft, rgba(234,179,8,0.08)); border:1px solid var(--warn, #eab308); border-radius:10px; padding:12px 14px; margin-bottom:14px">
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px">
            <span style="font-size:14px">⚠️</span>
            <span style="font-weight:700; font-size:13px; color:var(--warn-ink, #ca8a04)">Needs Your Attention (${attentionItems.length})</span>
          </div>
          <div style="display:flex; flex-direction:column; gap:6px">
            ${attentionItems.map(o => `
              <div style="display:flex; justify-content:space-between; align-items:center; background:var(--surface); padding:8px 12px; border-radius:6px; font-size:12px; border:1px solid var(--line)">
                <div><strong>${esc(o.p.name)}</strong> · <span class="code">${esc(o.i.code)}</span>: ${esc(o.i.title)}</div>
                <div style="display:flex; gap:6px; align-items:center">
                  <span class="stt ${o.i.status === 'Pending review' ? 'info' : 'bad'}" style="font-size:11px">${o.i.status}</span>
                  <button class="btn ghost" style="padding:2px 8px; font-size:11px" onclick="go('inspection:${o.i.code}')">View</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    const mainTabs = ['Create', 'In Progress', 'On Hold', 'Completed'];
    head = `${src.length} inspections`;
    body = `
      ${attentionBanner}
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap">
        <div class="chips" role="tablist" aria-label="Inspection tabs" style="margin-bottom:0">
          ${mainTabs.map(t => `<button class="chip ${activeTab === t ? 'active' : ''}" type="button" role="tab" onclick="S.listInsTab='${t}'; render(false);" aria-pressed="${activeTab === t}" style="font-weight:700; ${activeTab === t ? 'background:var(--mint); color:var(--on-mint);' : ''}">${t} <span style="font-size:11px; opacity:0.85; margin-left:4px">(${counts[t]})</span></button>`).join('')}

          + Create Inspection
        </button>
      </div>
      ${rows(list.map(o => insRow(o.i,o.p,showP)), `No inspections in ${activeTab}.`)}
    `;
  }
  return `<section class="lh"><div class="eyebrow">${head}</div><h1>${MODS[mod]}</h1></section>${chip}${body}`;
};

/* ---------- chrome & layout ---------- */
function label(e){
  if (!e) return '';
  if (e.v === 'landing') return 'SiteIQ Quality Platform';
  if (e.v === 'admin_dashboard') return 'Administration Console';
  if (e.v === 'home') return 'My projects';
  if (e.v === 'list') return MODS[e.mod] || 'List';
  if (e.v === 'project') return byId(e.id)?.name || 'Project';
  if (e.v === 'approval') return find('approvals', e.id)?.x.kind || 'Approval';
  if (e.v === 'engineer_dashboard') return 'My Inspections (Field Workspace)';
  if (e.v === 'inspection_execution') return `Inspection Execution · ${e.id}`;
  return e.id || '';
}

function navItems(){
  return [['home','home',0,false],['inspections','ins',P.reduce((a,p) => a + (p.ins || []).filter(i => i.status === 'Required').length,0),false],['ncs','nc',critOpen().length,true],['approvals','ap',allApprovals().length,false]];
}

function toggleUserProfilePopover() {
  const popover = $('userProfilePopover');

  if (isShown) {
    popover.style.display = 'none';
  } else {
    const user = getAuthenticatedUser();
    const org = getAuthenticatedOrg();
    const isEng = S.role === 'engineer';
    const isAdmin = S.role === 'admin';
    const name = user?.full_name || (isEng ? (typeof ENGINEER_WORKSPACE !== 'undefined' ? ENGINEER_WORKSPACE.activeEngineerName : 'Anjali Rao') : isAdmin ? 'Administrator' : 'Priya Deshmukh');
    const role = isAdmin ? 'SYSTEM ADMIN' : isEng ? 'FIELD ENGINEER' : 'QC LEAD';
    const orgName = org?.name || 'Purvanchal Group';
    const email = user?.email || (isEng ? 'anjali.rao@purvanchal.com' : isAdmin ? 'admin@purvanchal.com' : 'priya.deshmukh@purvanchal.com');
    const empId = user?.employee_id || (isEng ? (typeof ENGINEER_WORKSPACE !== 'undefined' ? ENGINEER_WORKSPACE.activeEngineerId : 'EMP-1004') : isAdmin ? 'ADM-001' : 'EMP-1001');
    const initials = name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();

    if ($('popoverName')) $('popoverName').textContent = name;

}

async function fetchAdminMembers() {
  try {
    const user = getAuthenticatedUser();
    const org = getAuthenticatedOrg();
    const orgId = org?.id || user?.org_id;
    const token = getStoredToken();
    const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
    const url = orgId ? `/api/auth/users?org_id=${encodeURIComponent(orgId)}` : '/api/auth/users';
    const res = await fetch(url, { headers });
    if (res.ok) {
      const data = await res.json();
      if (!window.ADMIN_CONSOLE_DATA) window.ADMIN_CONSOLE_DATA = {};
      window.ADMIN_CONSOLE_DATA.members = data.users || [];
      window.ADMIN_CONSOLE_DATA.loading = false;
      if (cur()?.v === 'admin_dashboard') render(false);
    }
  } catch(e) {
    console.warn('Error loading admin members:', e);
  }
}

function setAdminTab(tab) {
  if (!window.ADMIN_CONSOLE_DATA) window.ADMIN_CONSOLE_DATA = {};
  window.ADMIN_CONSOLE_DATA.activeTab = tab;
  render(false);
}

  const password = $('provPassword')?.value;
  const role = $('provRole')?.value || 'engineer';

  const spec = $('provSpec')?.value.trim() || undefined;
  const errBox = $('provisionErrorBox');
  const submitBtn = $('provSubmitBtn');

  const org = getAuthenticatedOrg();

  if (submitBtn) {

    submitBtn.innerHTML = '<span class="spinner"></span> Provisioning...';

        ...(token ? { 'Authorization': `Bearer ${token}` } : {})

        password: password,
        full_name: fullName,
        role: role,
        employee_id: empId,

/* ---------- unified navigation & back buttons ---------- */
function push(spec, pushHistory = true){
  const [v, id, tab] = spec.split(':');
  if (cur()) cur().y = window.scrollY;
  const e = v === 'project' ? {v, id, tab: tab || 'overview'} : {v, id};
  if (v === 'project'){ S.pNcClosed = false; S.pIns = 'all'; }
  S.stack.push(e);
  const pid = projOf(e); if (pid) S.ctx = pid;
  if (pushHistory && window.history && window.history.pushState) {
    window.history.pushState({ stackLen: S.stack.length, spec }, '', '#' + spec);
  }
  render(); window.scrollTo(0,0);
}

function back(){
  if (S.sheet) { closeSheet(); return; }
  const projModal = $('projectModalContainer');
  if (projModal && projModal.innerHTML.trim()) { closeCreateProjectModal(); return; }
  const provModal = $('provisionModalContainer');
  if (provModal && provModal.innerHTML.trim()) { closeProvisionMemberModal(); return; }
  const loginGate = $('loginGatewayContainer');
  if (loginGate && !loginGate.hidden) { handleLoginBack(); return; }

  if (S.stack.length > 1) {
    S.stack.pop();
    render();
    window.scrollTo(0, cur().y || 0);
  } else {
    if (!S.role && S.stack[0]?.v !== 'landing') {
      S.stack = [{ v: 'landing' }];
      render();
    }
  }
}

window.addEventListener('popstate', ev => {
  if (S.sheet) { closeSheet(false); return; }
  const projModal = $('projectModalContainer');
  if (projModal && projModal.innerHTML.trim()) { closeCreateProjectModal(); return; }
  const provModal = $('provisionModalContainer');
  if (provModal && provModal.innerHTML.trim()) { closeProvisionMemberModal(); return; }
  const loginGate = $('loginGatewayContainer');
  if (loginGate && !loginGate.hidden) { handleLoginBack(); return; }
  if (S.stack.length > 1) {
    S.stack.pop();
    render(false);
  }
});

function nav(mod){
  S.stack = [mod === 'home' ? {v:'home'} : {v:'list', mod}];
  render(); window.scrollTo(0,0);
}

function openSheet(spec){

       ${rows(list, closed ? 'No closed NCs yet.' : 'No open NCs.')}${closed && p.closedExtra ? `<p class="muted">Latest ${closedN(p).length} shown. ${p.closedExtra} earlier closed NCs are in the project register.</p>` : ''}`,

  } else if (k === 'actions'){

      `<button class="btn ghost" type="button" data-nav="ncs" data-lsevset="critical" style="width:100%">Open NC list</button>`);
  } else if (k === 'approvals'){
