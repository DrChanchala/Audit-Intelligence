    const htmlContent = window.marked ? marked.parse(reportData.content_markdown) : `<pre style="white-space:pre-wrap;font-family:inherit">${esc(reportData.content_markdown)}</pre>`;
    
    setSheet(`${it.code} · ${p.name}`, 'Detailed QA/QC Audit Report',
      `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)">
         <span class="ai-badge">🤖 ${esc(reportData.model_used)}</span>
         <span class="muted" style="font-size:11.5px">Generated ${fmt(reportData.created_at)} by ${esc(reportData.created_by)}</span>
       </div>
       <div class="report-content" id="report-print-area">
         ${htmlContent}
       </div>`,
      `<div style="display:flex;gap:8px;width:100%">
         <button class="btn primary" type="button" data-act="genReport:${it.code}" style="flex:1">⚡ Regenerate Analysis</button>
         <button class="btn ghost" type="button" onclick="window.print()" style="flex:0 0 110px">🖨️ Print</button>
       </div>`
    );
  } else if (k === 'allocateWizard'){
    if (typeof renderAllocateWizardSheet === 'function') {
      renderAllocateWizardSheet();
    }
  } else if (k === 'allocationDetail'){
    if (typeof renderAllocationDetailSheet === 'function') {
      renderAllocationDetailSheet(arg);
    }
  }
}

/* ---------- API Operations ---------- */
let tt;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }
function log(n, w, m){ if (!n.log) n.log = []; n.log.push({d:TODAY_ISO, w, m}); }

async function doAct(spec){
  const [k, code] = spec.split(':');

  if (k === 'genReport') {
    toast(`⚡ Synthesizing AI Audit Report for ${code}...`);
    try {
      const res = await fetch(`/api/inspections/${code}/generate-report`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'}
      });
      const data = await res.json();
      if (data.status === 'success' && data.report) {
        REPORTS_CACHE[code] = data.report;
        toast(`✨ Report generated via ${data.report.model_used}!`);
        openSheet(`report:${code}`);
        return;
      } else {
        toast(`Error: ${data.detail || 'Could not generate report'}`);
      }
    } catch (e) {
      console.warn("Backend report gen error:", e);
      toast(`Network error generating report`);
    }
    openSheet(`report:${code}`);
    return;
  }
  
  const actorName = getAuthenticatedUser()?.full_name || 'QC Lead';
  
  // Call REST backend if connected
  if (API_AVAILABLE) {
    try {
      if (['verify','close','remind','reopen'].includes(k)) {
        await fetch(`/api/ncs/${code}/action`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json', ...getAuthHeaders()},
          body: JSON.stringify({action: k, user: actorName})
        });
      } else if (['approve','return'].includes(k)) {
        await fetch(`/api/approvals/${code}/action`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json', ...getAuthHeaders()},
          body: JSON.stringify({action: k, user: actorName})
        });
      } else if (k === 'nudge') {
        await fetch(`/api/inspections/${code}/nudge`, { method: 'POST', headers: getAuthHeaders() });
      }
    } catch (e) {
      console.warn("Backend update error, applying locally:", e);
    }
  }

  // Local optimistic update
  if (['verify','close','remind','reopen'].includes(k)){
    const {x:n, p} = find('ncs', code);
    if (k === 'verify'){ n.status = 'Under verification'; log(n,'Sent for verification',`Re-inspection by ${n.by}`); toast(`Sent to ${n.by} for verification`); }
    if (k === 'close'){ n.status = 'Closed'; n.closed = TODAY_ISO; p.approvals = (p.approvals || []).filter(a => a.nc !== code); p.actions = (p.actions || []).filter(t => t.target.nc !== code); p.upd = [new Date().toISOString(), actorName]; toast(`${code} closed`); }
    if (k === 'reopen'){ n.status = 'Reopened'; p.approvals = (p.approvals || []).filter(a => a.nc !== code); log(n,`Reopened by ${actorName}`,`Back with ${n.assigned}`); toast(`${code} reopened and sent back to ${n.assigned}`); }
    if (k === 'remind'){ const late = ncLate(n); log(n, late ? 'Escalated' : 'Reminder sent', `To ${n.assigned}`); toast(late ? `Escalated to ${n.assigned}` : `Reminder sent to ${n.assigned}`); }
    render(false); return;
  }
  if (k === 'approve' || k === 'return'){
    const {x:a, p} = find('approvals', code);
    p.approvals = (p.approvals || []).filter(x => x !== a);
    const i = a.ins && (p.ins || []).find(x => x.code === a.ins), n = a.nc && (p.ncs || []).find(x => x.code === a.nc);
    if (k === 'approve'){
      if (i) i.status = 'Report issued';
      if (n){ n.status = 'Closed'; n.closed = TODAY_ISO; }
      if (!i && !n) p.actions = (p.actions || []).filter(t => !t.title.startsWith('Approve'));
      p.upd = [new Date().toISOString(), actorName];
      toast(i ? `Report issued for ${i.code}` : n ? `${n.code} closed` : 'ITP approved and published');
    } else {
      if (i) i.status = 'In progress';
      if (n){ n.status = 'Reopened'; log(n,`Closure returned by ${actorName}`,'Verification evidence not sufficient'); }
      toast(`Returned to ${a.by}`);
    }
    back(); return;
  }
  if (k === 'nudge'){ const {x:i} = find('ins', code); toast(insLate(i) ? `Chased ${i.eng}` : `Reminder sent to ${i.eng}`); }
}

async function allocate(spec){
  const [code, nm] = spec.split('|'), {x:i, p} = find('ins', code);
  const actorName = getAuthenticatedUser()?.full_name || 'QC Lead';
  
  if (API_AVAILABLE) {
    try {
      await fetch(`/api/inspections/${code}/allocate`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', ...getAuthHeaders()},
        body: JSON.stringify({engineer_name: nm, user: actorName})
      });
    } catch (e) {
      console.warn("Backend allocate error:", e);
    }
  }

  const was = i.eng; i.eng = nm; if (i.status === 'Required') i.status = 'Allocated';
  p.actions = (p.actions || []).filter(t => t.target.ins !== code);
  closeSheet(); render(false); toast(was && was !== nm ? `Reassigned to ${nm}` : `Allocated to ${nm}`);
}

/* ---------- sync with backend ---------- */
async function syncFromBackend(){
  try {
    const authHeaders = getAuthHeaders();
    const [pRes, insRes, allocRes] = await Promise.all([
      fetch('/api/projects', { headers: authHeaders }).catch(() => null),
      fetch('/api/inspections', { headers: authHeaders }).catch(() => null),
      fetch('/api/allocations', { headers: authHeaders }).catch(() => null)
    ]);
    if (pRes && pRes.ok) {
      const liveProjects = await pRes.json();
      if (Array.isArray(liveProjects)) {
        if (getStoredToken()) {
          P = liveProjects;
        } else if (liveProjects.length > 0) {
          P = liveProjects;
        }
        console.log(`Loaded ${P.length} live multi-tenant projects from API`);
      }
    }

    if (pRes && pRes.ok) {
      API_AVAILABLE = true;
      console.log("Connected to Audit Intelligence live backend API");
    }

    // Hydrate allocations cache
    if (allocRes && allocRes.ok) {
      const allocData = await allocRes.json();
      if (allocData.status === 'success' && Array.isArray(allocData.allocations)) {
        allocData.allocations.forEach(a => {
          if (typeof ALLOCATIONS_CACHE !== 'undefined') {
            ALLOCATIONS_CACHE[a.allocation_id] = a;
          }
        });
      }
    }

    // Hydrate project inspections from live database
    if (insRes && insRes.ok) {
      const insList = await insRes.json();
      if (Array.isArray(insList)) {
        insList.forEach(item => {
          const p = byId(item.project_id);
          if (p) {
            if (!p.ins) p.ins = [];
            const existing = p.ins.find(x => x.code === item.code);
            if (existing) {
              existing.status = item.status;
              existing.eng = item.eng;
              existing.due = item.due_date;
              existing.items_count = item.items_count;
              if (item.zone) existing.zone = item.zone;
              if (item.title) existing.title = item.title;
              if (item.tpl) existing.tpl = item.tpl;
              if (item.items_count > 0 && !existing.res) {
                existing.res = {
                  items: item.items_count,
                  pass: item.items_pass,
                  nc: item.items_nc,
                  na: item.items_na
                };
              }
            } else {
              p.ins.unshift({
                code: item.code,
                title: item.title,
                zone: item.zone,
                tpl: item.tpl,
                eng: item.eng,
                due: item.due_date,
                status: item.status,
                items_count: item.items_count,
                priority: 'High',
                res: item.items_count > 0 ? {
                  items: item.items_count,
                  pass: item.items_pass,
                  nc: item.items_nc,
                  na: item.items_na
                } : null
              });
            }
          }
        });
      }
    }

    // Secondary merge from localStorage for local persistence
    try {
      const localAllocs = JSON.parse(localStorage.getItem('siteiq_allocations') || '[]');
      localAllocs.forEach(alloc => {
        const p = byId(alloc.project_id);
        if (p) {
          if (!p.ins) p.ins = [];
          if (!p.ins.some(x => x.code === alloc.allocation_id)) {
            p.ins.unshift({
              code: alloc.allocation_id,
              title: alloc.title || (alloc.stages && alloc.stages[0]) || 'Quality Inspection',
              zone: alloc.location_scope,
              tpl: alloc.tpl || (alloc.subgroups && alloc.subgroups[0]) || 'Stage Checkpoints',
              eng: alloc.engineer_name,
              due: alloc.due_date,
              status: alloc.status || 'Allocated',
              priority: alloc.priority || 'High',
              items_count: alloc.checkpoint_count || (alloc.checkpoints ? alloc.checkpoints.length : 1),
              res: null
            });
          }
        }
      });
    } catch(e) {}

    render(false);
  } catch(e) {
    console.info("Using local fast client state mode:", e.message);
  }
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('button, [data-go]'); if (!el) return;
  const d = el.dataset;
  if (d.go){ if (S.sheet) closeSheet(false); push(d.go); return; }
  if (d.sheet){ openSheet(d.sheet); return; }
  if (d.nav){ if (S.sheet) closeSheet(false); if (d.lsevset){ S.listNc = {closed:false, sev:d.lsevset}; S.ctx = null; } nav(d.nav); return; }
  if ('back' in d){ back(); return; }
  if (d.crumb){ S.stack = S.stack.slice(0, +d.crumb + 1); render(); window.scrollTo(0, cur().y || 0); return; }
  if (d.cat){ S.cat = d.cat; S.q = ''; const q = $('q'); if (q) q.value = ''; renderCards(); return; }
  if (d.ptab){ cur().tab = d.ptab; render(false); return; }
  if (d.pins){ S.pIns = d.pins; cur().tab = 'inspections'; render(false); return; }
  if (d.pnc){ S.pNcClosed = d.pnc === 'closed'; render(false); return; }
  if (d.stab){ S.sheetTab = d.stab; drawSheet(); return; }
  if (d.lnc){ S.listNc.closed = d.lnc === 'closed'; render(false); return; }
  if (d.lsev){ S.listNc.sev = d.lsev; render(false); return; }
  if (d.lins){ S.listIns = d.lins; render(false); return; }
  if (d.act){ doAct(d.act); return; }
  if (d.allocate){ allocate(d.allocate); return; }
  if (d.ctx){ S.ctx = d.ctx; closeSheet(false); render(false); return; }
  if ('ctxClear' in d){ S.ctx = null; render(false); return; }
  if (d.soon){ toast(`${d.soon} opens in a later screen`); return; }
});

document.addEventListener('input', ev => { if (ev.target.id === 'q'){ S.q = ev.target.value; renderCards(); } });
$('sheetX').addEventListener('click', () => closeSheet());
scrim.addEventListener('click', () => closeSheet());
document.addEventListener('keydown', ev => {
  if (!S.sheet) return;
  if (ev.key === 'Escape'){ closeSheet(); return; }
  if (ev.key === 'Tab'){
    const f = [...sheet.querySelectorAll('button:not([disabled])')]; if (!f.length) return;
    if (ev.shiftKey && document.activeElement === f[0]){ ev.preventDefault(); f[f.length-1].focus(); }
    else if (!ev.shiftKey && document.activeElement === f[f.length-1]){ ev.preventDefault(); f[0].focus(); }
  }
});

/* drag dismiss for mobile */
let drag = null; const grab = $('grab');
grab.addEventListener('pointerdown', ev => { drag = {y:ev.clientY, dy:0}; sheet.style.transition = 'none'; grab.setPointerCapture(ev.pointerId); });
grab.addEventListener('pointermove', ev => { if (!drag) return; drag.dy = Math.max(0, ev.clientY - drag.y); sheet.style.transform = `translateY(${drag.dy}px)`; });
const endDrag = () => { if (!drag) return; sheet.style.transition = ''; sheet.style.transform = ''; if (drag.dy > 90) closeSheet(); drag = null; };
grab.addEventListener('pointerup', endDrag); grab.addEventListener('pointercancel', endDrag);

syncFromBackend().then(() => {
  if (!S.role) {
    if (_isForceLogin) renderLoginGateway('org');
  } else if (S.role === 'engineer') {
    if (typeof fetchEngineerDashboardData === 'function') {
      fetchEngineerDashboardData(_storedEngId).then(() => render(false));
    }
  } else if (S.role === 'admin') {
    fetchAdminMembers();
  }
  const urlParams = new URLSearchParams(window.location.search);
  const testState = urlParams.get('test_state');
  if (testState === 'step5') {
    if (typeof ALLOC_WIZARD !== 'undefined') {
      ALLOC_WIZARD.projectId = 'psv';
      ALLOC_WIZARD.engineerId = 'EMP-1004';
      ALLOC_WIZARD.engineer = 'Anjali Rao';
      ALLOC_WIZARD.selectedCheckpoints = new Set(['CHK-01-01-001']);
      ALLOC_WIZARD.step = 5;
      if (typeof openSheet === 'function') openSheet('allocateWizard');
    }
  } else if (testState === 'allocated') {
    S.ctx = 'psv';
    S.pIns = 'Allocated';
    S.stack = [{ v: 'project', id: 'psv', tab: 'inspections' }];
    render(false);
  } else if (testState === 'detail') {
    S.ctx = 'psv';
    S.stack = [{ v: 'inspection', id: 'ALC-0012-0002' }];
    render(false);
  } else if (testState === 'drawer') {
    S.ctx = 'psv';
    S.stack = [{ v: 'project', id: 'psv', tab: 'inspections' }];
    render(false);
    if (typeof openAllocationDetail === 'function') openAllocationDetail('ALC-0012-0002');
  }
});

render();
if (_isForceLogin && !S.role) {
  renderLoginGateway('org');
}
